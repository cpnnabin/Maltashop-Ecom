# MaltaShop prototype: Order + Inventory services, each with its own PostgreSQL database,
# connected only through RabbitMQ. Start everything with:  docker compose up --build
# Every credential can be overridden from a .env file (copy .env.example to .env); the defaults are for a laptop only.
# After upgrading from an older version of this project, reset the old databases once: docker compose down -v

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order}
      POSTGRES_DB: orders
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orders"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      POSTGRES_DB: inventory
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://order:${ORDER_DB_PASSWORD:-order}@postgres-order:5432/orders
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      # Inventory declares its queue before it reports healthy, so an OrderPlaced event
      # published right after start-up is never dropped for lack of a queue.
      inventory-service:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD:-inventory}@postgres-inventory:5432/inventory
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
    restart: unless-stopped

volumes:
  order-data:
  inventory-data: